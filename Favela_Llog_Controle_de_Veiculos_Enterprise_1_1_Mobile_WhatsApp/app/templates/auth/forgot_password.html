{% extends 'base.html' %}
{% block title %}Esqueci minha senha · Favela Llog{% endblock %}
{% block content %}
<section class="login-card"><img src="{{ url_for('static', filename='img/logo.png') }}" class="login-logo"><h2>Recuperar senha</h2><p>Validação pela CNH cadastrada</p><form method="post"><label>Usuário<input name="username" required autofocus autocomplete="username"></label><label>CNH cadastrada<input name="cnh_number" inputmode="numeric" maxlength="11" placeholder="11 números" required></label><label>Nova senha<input name="new_password" type="password" minlength="6" required autocomplete="new-password"></label><label>Confirmar nova senha<input name="confirm_password" type="password" minlength="6" required autocomplete="new-password"></label><button>Redefinir senha</button></form><a class="login-help" href="{{url_for('auth.login')}}">← Voltar para o login</a><small>Para administradores, a recuperação deve ser feita por outro administrador autorizado.</small></section>
{% endblock %}
