{% extends 'base.html' %}{% block content %}<header class="page-head"><div><h2>Nova manutenção</h2><p>Registre período, serviço, valor e comprovante.</p></div></header><form method="post" enctype="multipart/form-data" class="panel form-grid">{% if current_user.is_admin %}<label>Veículo<select name="vehicle_id" required><option value="">Selecione</option>{% for v in vehicles %}<option value="{{v.id}}">{{v.plate}} · {{v.brand}} {{v.model}}</option>{% endfor %}</select></label>{% else %}<div class="readonly">{{vehicle.plate if vehicle else 'Sem moto vinculada'}}</div>{% endif %}<label>Data inicial<input type="date" name="start_date" value="{{today}}" required></label><label class="check"><input type="checkbox" name="same_day" id="sameDay" checked> Serviço no mesmo dia</label><label id="endDateWrap">Data de retirada<input type="date" name="end_date"></label><label>Status<select name="status"><option value="IN_PROGRESS">Em manutenção</option><option value="COMPLETED">Concluída</option></select></label><label>Valor<input name="amount" required></label><label>Quilometragem<input type="number" name="odometer" required></label><label>Oficina<input name="workshop"></label><label class="wide">Descrição<textarea name="description" required></textarea></label><label class="check"><input type="checkbox" name="is_oil_change" id="oilChange"> É troca de óleo</label><div class="wide oil-fields" id="oilFields"><label>Tipo de óleo<input name="oil_type"></label><label>Intervalo em km<input type="number" name="oil_interval_km" value="3000"></label><label>Prazo em meses<input type="number" name="oil_interval_months" value="6"></label></div><label class="wide camera-field"><span>Foto da nota</span><span class="camera-button">📷 Abrir câmera</span><input class="camera-input" type="file" name="receipt" accept="image/*" capture="environment" required data-preview="maintenancePreview"><small>A câmera traseira será aberta no celular.</small></label><img id="maintenancePreview" class="receipt-preview" alt="Pré-visualização da nota" hidden><label class="wide">Observação<textarea name="notes"></textarea></label><button class="wide">Salvar manutenção</button></form>{% endblock %}
