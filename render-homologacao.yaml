services:
  - type: web
    name: favela-llog-veiculos-homologacao
    runtime: python
    plan: free
    repo: https://github.com/vpiveta/favela-llog-controle-veiculos
    branch: enterprise-2-0-multibase-diretoria
    rootDir: Favela_Llog_Controle_de_Veiculos_Enterprise_1_1_Mobile_WhatsApp
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      - key: APP_TIMEZONE
        value: America/Sao_Paulo
      - key: HOMOLOG_ADMIN_USER
        value: piveta
      - key: HOMOLOG_ADMIN_NAME
        value: Victor Piveta
      - key: HOMOLOG_ADMIN_PASSWORD
        sync: false
