{% extends 'base.html' %}{% block content %}<header class="page-head"><div><h2>Novo abastecimento</h2><p>Registre o gasto e anexe a nota.</p></div></header><form method="post" enctype="multipart/form-data" class="panel form-grid">{% if current_user.is_admin %}<label>Veículo<select name="vehicle_id" required><option value="">Selecione</option>{% for v in vehicles %}<option value="{{v.id}}">{{v.plate}} · {{v.brand}} {{v.model}}</option>{% endfor %}</select></label>{% else %}<div class="readonly">{{vehicle.plate if vehicle else 'Sem moto vinculada'}}</div>{% endif %}<label>Data<input type="date" name="expense_date" value="{{today}}" required></label><label>Valor<input name="amount" inputmode="decimal" required></label><label>Litros<input name="liters" inputmode="decimal"></label><label>Combustível<select name="fuel_type"><option>GASOLINE</option><option>ETHANOL</option></select></label><label>Quilometragem<input type="number" name="odometer" required></label><label>Posto<input name="station"></label><label class="wide">Foto/PDF da nota<input type="file" name="receipt" accept="image/*,.pdf" required></label><label class="wide">Observação<textarea name="notes"></textarea></label><button class="wide">Salvar abastecimento</button></form>{% endblock %}
