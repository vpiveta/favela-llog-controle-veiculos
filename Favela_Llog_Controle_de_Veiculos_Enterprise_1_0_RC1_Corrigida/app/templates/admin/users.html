{% extends 'base.html' %}{% block content %}<header class="page-head"><div><h2>Usuários</h2><p>Cadastre administradores e motoristas.</p></div></header><div class="grid2"><form method="post" class="panel form-grid"><label>Nome<input name="name" required></label><label>Login<input name="username" required></label><label>E-mail<input type="email" name="email"></label><label>Celular<input name="phone"></label><label>Perfil<select name="role"><option value="DRIVER">Motorista</option><option value="ADMIN">Administrador</option></select></label><label>Senha inicial<input type="password" name="password" minlength="8" required></label><label>Confirmar senha<input type="password" name="confirm_password" minlength="8" required></label><button class="wide">Criar usuário</button></form><section class="panel"><h3>Usuários cadastrados</h3>{% for u in users %}<div class="list-row"><b>{{u.name}}</b><span>{{u.username}} · {{u.role}}</span></div>{% endfor %}</section></div>{% endblock %}
