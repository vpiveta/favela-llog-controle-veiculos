{% extends 'base.html' %}{% block content %}<header class="page-head"><div><h2>Veículos</h2><p>Cadastre motos e vincule motoristas.</p></div></header><div class="grid2"><form method="post" class="panel form-grid"><label>Placa<input name="plate" required></label><label>Marca<input name="brand" required></label><label>Modelo<input name="model" required></label><label>Ano<input type="number" name="year"></label><label>Quilometragem<input type="number" name="current_km" value="0"></label><label>Motorista<select name="driver_id"><option value="">Sem vínculo</option>{% for d in drivers %}<option value="{{d.id}}">{{d.name}}</option>{% endfor %}</select></label><button class="wide">Cadastrar veículo</button></form><section class="panel"><h3>Frota</h3>{% for v in vehicles %}<div class="vehicle-card"><b>{{v.plate}} · {{v.brand}} {{v.model}}</b><span>{{v.current_km}} km · {{v.status}}</span><small>{{v.driver.name if v.driver else 'Sem motorista'}}</small></div>{% endfor %}</section></div>{% endblock %}
